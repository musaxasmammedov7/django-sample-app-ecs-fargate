# =============================================================================
# Local development / smoke-test stack.
#
# Usage:
#   docker compose up --build
#   open http://localhost:8000
#
# This mirrors the production topology (Django + PostgreSQL) so that the same
# container image can be validated before it is pushed to Amazon ECR.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hc
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: hc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hc -d hc"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: django-sample-app:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: hc
      DB_USER: hc
      DB_PASSWORD: hc
      DB_SSLMODE: disable
      SECRET_KEY: local-dev-secret-key-not-for-production
      DEBUG: "False"
      SITE_ROOT: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
