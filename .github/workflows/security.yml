name: Security

# =============================================================================
# Dedicated image / supply-chain security pipeline (Task 3).
#
# Tools:
#   - hadolint  : Dockerfile best-practice linting
#   - Trivy     : IaC misconfiguration scan (Dockerfile + Terraform)
#   - Syft      : generate a Software Bill of Materials (SBOM)
#   - Grype     : Anchore vulnerability scanner for the SBOM and the built image
#
# All findings are published to the GitHub "Security" tab (SARIF), and the SBOM
# is stored as a workflow artifact for compliance / audit.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-prod.txt'
      - 'terraform-aws-ecs-fargate/**'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-prod.txt'
      - 'terraform-aws-ecs-fargate/**'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly re-scan so newly published CVEs are caught even without code changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: django-sample-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Dockerfile linting (CIS / best practices)
  # ---------------------------------------------------------------------------
  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ---------------------------------------------------------------------------
  # 2. IaC / Dockerfile misconfiguration scan (Trivy)
  # ---------------------------------------------------------------------------
  trivy-iac:
    name: IaC misconfiguration (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ---------------------------------------------------------------------------
  # 3. SBOM (Syft) + dependency vulnerability scan (Grype / Anchore)
  # ---------------------------------------------------------------------------
  sbom-and-dependencies:
    name: SBOM & dependency scan (Syft + Grype)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx
          upload-artifact: true

      - name: Scan dependencies with Grype
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: sbom.spdx.json
          output-format: sarif
          output-file: grype-deps.sarif
          severity-cutoff: high
          only-fixed: true
          fail-build: false

      - name: Upload dependency SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-deps.sarif
          category: grype-dependencies

  # ---------------------------------------------------------------------------
  # 4. Build the image and scan it (Grype / Anchore)
  # ---------------------------------------------------------------------------
  image-scan:
    name: Container image scan (Grype)
    runs-on: ubuntu-latest
    needs: [hadolint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Grype
        id: grype
        uses: anchore/scan-action@v7.4.2
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          output-format: sarif
          output-file: grype-image.sarif
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-image.sarif
          category: grype-image
