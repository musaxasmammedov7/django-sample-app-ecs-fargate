name: CI/CD

# =============================================================================
# Build -> scan (Trivy) -> push (Amazon ECR) -> deploy (ECS).
#
# AWS access uses GitHub OIDC (no long-lived access keys). The IAM role and its
# trust policy are created by Terraform (see
# terraform-aws-ecs-fargate/ecs.tf, section "GitHub Actions OIDC").
#
# Required repository configuration:
#   Variables: AWS_ROLE_ARN   -> arn of the role Terraform created
#   Secrets:   none           (OIDC -> STS, no static credentials)
# Optional overrides (Variables):
#   AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one pipeline per ref; PRs cancel superseded runs, main does not.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write        # required for GitHub OIDC -> AWS STS
  security-events: write # required to upload Trivy SARIF results

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'django-sample-app' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'django-sample-app' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'django-sample-app' }}
  IMAGE_TAG: ${{ github.sha }}
  PYTHON_VERSION: '3.12'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static checks: Django system checks + migrations drift detection.
  # ---------------------------------------------------------------------------
  lint-test:
    name: Lint & Django checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Ensure no missing migrations
        run: python manage.py makemigrations --check --dry-run

  # ---------------------------------------------------------------------------
  # 2. Scan the source tree (vulnerabilities, secrets, IaC misconfiguration).
  # ---------------------------------------------------------------------------
  trivy-repo-scan:
    name: Trivy repo scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-repo.sarif
          exit-code: '0'

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  # 3. Build the image, scan it, then push to ECR and roll out the ECS service.
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan & push
    runs-on: ubuntu-latest
    needs: [lint-test, trivy-repo-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: '1'

      - name: Upload image SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & push image to ECR
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          # ECR repository is IMMUTABLE: only the unique commit-SHA tag is
          # pushed, never a mutable "latest" tag.
          docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Register new task definition revision
        if: github.event_name != 'pull_request'
        id: task-def
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          aws ecs describe-task-definition \
            --task-definition "${ECS_SERVICE}" \
            --query 'taskDefinition' \
            --region "${AWS_REGION}" \
            --no-cli-pager > task-definition.json

          # Drop fields that register-task-definition does not accept.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy,
                  .enableFaultInjection)' \
            task-definition.json > new-task-definition.json

          # Point the application container at the immutable commit-SHA image.
          jq --arg IMG "${IMAGE_URI}" \
            '(.containerDefinitions[] | select(.name == "app") | .image) = $IMG' \
            new-task-definition.json > final-task-definition.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://final-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text \
            --region "${AWS_REGION}" \
            --no-cli-pager)

          echo "task_definition_arn=${TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${{ steps.task-def.outputs.task_definition_arn }}" \
            --region "${AWS_REGION}" \
            --no-cli-pager

      - name: Wait for ECS service to reach steady state
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}"
