name: Terraform

# =============================================================================
# Validates the Infrastructure as Code in terraform-aws-ecs-fargate/.
# Runs on every change to the Terraform sources. No AWS credentials are needed
# because it only performs `fmt -check`, `init -backend=false` and `validate`.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'terraform-aws-ecs-fargate/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform-aws-ecs-fargate/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_WORKING_DIR: terraform-aws-ecs-fargate

jobs:
  validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.1'

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}
