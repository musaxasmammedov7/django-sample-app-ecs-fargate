---
# Clone application code and install dependencies

- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  become: yes

- name: Clone/update application from GitHub
  ansible.builtin.git:
    repo: "{{ github_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ github_branch }}"
    force: yes
  become: yes
  become_user: "{{ app_user }}"

- name: Install Python requirements
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    executable: pip3
  become: yes