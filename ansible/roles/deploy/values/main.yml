---
# deploy values - override these for your environment
# db_password comes from the Ansible inventory [all:vars]
# (generated by Terraform from terraform.tfvars) - never hardcode secrets here.

db_host: "{{ hostvars[groups['database'][0]]['ansible_host'] | default('localhost') }}"
db_port: 5432
db_name: hc
db_user: hc_user
